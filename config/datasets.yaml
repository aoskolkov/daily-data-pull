  # ── Precious & base metals (Datastream commodities) ───────────────────────────
  # Source: tr_ds_comds.wrds_cmdy_info + wrds_cmdy_data via wrds_ds_comds adapter.
  # Precious metals (USD/troy oz): gold (1968), silver (1970/2012), platinum (1976),
  #   palladium (1987).
  # LME base metals (USD/MT): aluminium 99.7% (LAHCASH, 1988; monthly until 1993-06), aluminium alloy
  #   (LADCASH, 1993), lead (LEDCASH, 1993).
  # Note: LME cash prices for copper, zinc, nickel, tin are NOT in tr_ds_comds —
  #   need to locate in tr_ds_equities or tr_ds_fut (TODO). Use LCP15MT/LZZ15MT/
  #   LNI15MT (15-month forwards, USD) as proxies if needed.
  # SLVCASH (1970–2014, cents/troy oz) overlaps SILVPM$ (2012–present, USD/troy oz).
  - name: ds_metals
    source: wrds_ds_comds
    start: "1968-01-01"
    incremental_key: date_
    mnemonics:
      # Precious metals
      - GOLDBLN    # Gold Bullion LBM USD/troy oz (1968–present)
      - SLVCASH    # Silver Fix LBM Cash USD cents/troy oz (1970–2014, dead)
      - SILVPM$    # Silver Perth Mint USD/troy oz (2012–present)
      - PLATFRE    # Platinum London Free Market USD/troy oz (1976–present)
      - PALLADM    # Palladium USD/troy oz (1987–present)
      # LME base metals (confirmed in tr_ds_comds, USD/MT)
      - LAHCASH    # LME Aluminium 99.7% Cash USD/MT (1988–present; monthly until 1993-06)
      - LADCASH    # LME Aluminium Alloy Cash USD/MT (1993–present)
      - LEDCASH    # LME Lead Cash USD/MT (1993–present)
    note: >
      Precious metals (gold, silver, platinum, palladium) and LME base metals
      from LSEG Datastream via WRDS tr_ds_comds. All USD except SLVCASH which is
      cents/troy oz. Silver has two overlapping series: SLVCASH (1970–2014 dead)
      and SILVPM$ (2012–present active). LME copper, zinc, nickel, and tin cash
      prices are NOT in tr_ds_comds; see TODO in config.

  # ── Energy commodities (Datastream) ──────────────────────────────────────────
  # Brent spot: OILBREN = BFO Month 1 USD/barrel (1970–present, 11,197 obs; monthly until 1981).
  # Nat gas: NATLGAS = Henry Hub USD/MMBTU (1993–2018-08 daily, one stray obs 2020-09; dead). Active UK
  #   NBP gas is NATBGAS (GBP, ICE). No active USD Henry Hub spot in comds.
  # Heating oil: EIAHONY = NY Harbor Spot FOB USD/gallon (1986–present, WEEKLY).
  # Gasoline: GSUNLRG = Unleaded Regular Non-Oxy NY US cents/gallon (1983–present).
  - name: ds_energy_comds
    source: wrds_ds_comds
    start: "1970-01-01"
    incremental_key: date_
    mnemonics:
      - OILBREN    # Brent crude BFO Month 1 USD/barrel (1970–present; monthly until 1981)
      - NATLGAS    # Henry Hub natural gas USD/MMBTU (1993–2018-08, dead)
      - EIAHONY    # Heating oil No.2 NYH Spot FOB USD/gallon (1986–present, weekly)
      - GSUNLRG    # Gasoline unleaded regular NY US cents/gallon (1983–present)
    note: >
      Energy commodity spot prices from LSEG Datastream via WRDS tr_ds_comds.
      WTI crude is separate (ds_wti_front, ds_wti_curve). NATLGAS daily data end
      2018-08 (plus one stale obs on 2020-09-24; dead series); no active USD Henry Hub
      in tr_ds_comds after that. EIAHONY is weekly; GSUNLRG is in US cents/gallon.

