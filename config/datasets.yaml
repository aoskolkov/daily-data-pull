      - WINZEAL    # New Zealand: FTSE New Zealand (1981–present, NZD)
      - HNGKNGI    # Hong Kong: Hang Seng (1964–present, HKD)
      - WISNGP$    # Singapore: FTSE W Singapore USD (1981–present, USD)
      - ISTGENS    # Israel: Tel Aviv SE General (1984–present, ILS)
