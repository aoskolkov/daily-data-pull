      - FITMISE    # Italy: FTSE Italia MIB Storico (1975–present, EUR)
      - MADRIDI    # Spain: Madrid SE General IGBM (1974–present, EUR)
      - AMSTEOE    # Netherlands: AEX Index (1983–present, EUR)
