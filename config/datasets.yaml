  # ── Precious & base metals (Datastream commodities) ───────────────────────────
  # Source: tr_ds_comds.wrds_cmdy_info + wrds_cmdy_data via wrds_ds_comds adapter.
  # Precious metals (USD/troy oz): gold (1968), silver (1970/2012), platinum (1976),
  #   palladium (1987).
  # LME base metals (USD/MT): aluminium 99.7% (LAHCASH, 1988), aluminium alloy
  #   (LADCASH, 1993), lead (LEDCASH, 1993).
  # Note: LME cash prices for copper, zinc, nickel, tin are NOT in tr_ds_comds —
  #   need to locate in tr_ds_equities or tr_ds_fut (TODO). Use LCP15MT/LZZ15MT/
  #   LNI15MT (15-month forwards, USD) as proxies if needed.
  # SLVCASH (1970–2014, cents/troy oz) overlaps SILVPM$ (2012–present, USD/troy oz).
  - name: ds_metals
    source: wrds_ds_comds
    start: "1968-01-01"
    incremental_key: date_
    mnemonics:
      # Precious metals
      - GOLDBLN    # Gold Bullion LBM USD/troy oz (1968–present)
      - SLVCASH    # Silver Fix LBM Cash USD cents/troy oz (1970–2014, dead)
      - SILVPM$    # Silver Perth Mint USD/troy oz (2012–present)
      - PLATFRE    # Platinum London Free Market USD/troy oz (1976–present)
      - PALLADM    # Palladium USD/troy oz (1987–present)
      # LME base metals (confirmed in tr_ds_comds, USD/MT)
      - LAHCASH    # LME Aluminium 99.7% Cash USD/MT (1988–present)
      - LADCASH    # LME Aluminium Alloy Cash USD/MT (1993–present)
      - LEDCASH    # LME Lead Cash USD/MT (1993–present)
    note: >
      Precious metals (gold, silver, platinum, palladium) and LME base metals
      from LSEG Datastream via WRDS tr_ds_comds. All USD except SLVCASH which is
      cents/troy oz. Silver has two overlapping series: SLVCASH (1970–2014 dead)
      and SILVPM$ (2012–present active). LME copper, zinc, nickel, and tin cash
      prices are NOT in tr_ds_comds; see TODO in config.

  # ── Energy commodities (Datastream) ──────────────────────────────────────────
  # Brent spot: OILBREN = BFO Month 1 USD/barrel (1970–present, 13,443 obs).
  # Nat gas: NATLGAS = Henry Hub USD/MMBTU (1993–2020, dead 2020). Active UK
  #   NBP gas is NATBGAS (GBP, ICE). No active USD Henry Hub spot in comds.
  # Heating oil: EIAHONY = NY Harbor Spot FOB USD/gallon (1986–present).
  # Gasoline: GSUNLRG = Unleaded Regular Non-Oxy NY USD/gallon (1983–present).
  - name: ds_energy_comds
    source: wrds_ds_comds
    start: "1970-01-01"
    incremental_key: date_
    mnemonics:
      - OILBREN    # Brent crude BFO Month 1 USD/barrel (1970–present)
      - NATLGAS    # Henry Hub natural gas USD/MMBTU (1993–2020 dead)
      - EIAHONY    # Heating oil No.2 NYH Spot FOB USD/gallon (1986–present)
      - GSUNLRG    # Gasoline unleaded regular NY USD/gallon (1983–present)
    note: >
      Energy commodity spot prices from LSEG Datastream via WRDS tr_ds_comds.
      WTI crude is separate (ds_wti_front, ds_wti_curve). NATLGAS ends 2020-09
      (dead series); no active USD Henry Hub in tr_ds_comds after that date.

  # ── Agricultural commodities (Datastream) ────────────────────────────────────
  # Grains: wheat (WHEATMP, spring Minneapolis, 1979), corn (CORNUS2, 1979),
  #   soybeans (SOYBEAN, 1979) — all USD/bushel.
  # Softs: coffee (COFDICA, ICO composite daily, 1986, USD/lb), cocoa (COCINUS,
  #   ICCO daily USD/MT, 1985), sugar (WSUGDLY, ISA daily USD/lb, 1985),
  #   cotton (COTTONM, Memphis USD/lb, 1980).
  - name: ds_agri_comds
    source: wrds_ds_comds
    start: "1979-01-01"
    incremental_key: date_
    mnemonics:
      - WHEATMP    # Wheat spring Minneapolis USD/bushel (1979–present)
      - CORNUS2    # Corn No.2 yellow central Illinois USD/bushel (1979–present)
      - SOYBEAN    # Soybeans No.1 yellow USD/bushel (1979–present)
      - COFDICA    # Coffee ICO Composite daily USD/lb (1986–present)
      - COCINUS    # Cocoa ICCO daily price USA USD/MT (1985–present)
      - WSUGDLY    # Raw sugar ISA daily price USD/lb (1985–present)
      - COTTONM    # Cotton 1-1/16 STR Low-Middling Memphis USD/lb (1980–present)
    note: >
      Agricultural commodity spot prices from LSEG Datastream via WRDS tr_ds_comds.
      Grains are USD/bushel; softs are USD/lb or USD/MT as noted.

  # ── Commodity indices (Datastream) ────────────────────────────────────────────
  # S&P GSCI family (1969–present): spot, total return, excess return variants.
  # Refinitiv CRB Equal Weight (NYFECRB, 1956–2021, dead).
  # Bloomberg Commodity Index (BCOM) not found in tr_ds_comds; may require
  # direct Datastream access or separate download.
  - name: ds_comdy_indices
    source: wrds_ds_comds
    start: "1956-01-01"
    incremental_key: date_
    mnemonics:
      - CGSYSPT    # S&P GSCI Commodity Spot Index (1969–present)
      - GSCITOT    # S&P GSCI Commodity Total Return (1969–present)
      - GSCIEXR    # S&P GSCI Commodity Excess Return (1969–present)
      - GSNESPT    # S&P GSCI Non-Energy Spot (1969–present)
      - GSNETOT    # S&P GSCI Non-Energy Total Return (1969–present)
      - GSAGSPT    # S&P GSCI Agriculture Spot (1969–present)
      - GSAGTOT    # S&P GSCI Agriculture Total Return (1969–present)
      - GSPMSPT    # S&P GSCI Precious Metal Spot (1973–present)
      - GSPMTOT    # S&P GSCI Precious Metal Total Return (1973–present)
      - NYFECRB    # Refinitiv CRB Equal Weight Index (1956–2021, dead)
    note: >
      Commodity price indices from LSEG Datastream via WRDS tr_ds_comds.
      S&P GSCI family has three return variants: Spot (price index only),
      Excess Return (futures roll, no T-bill), Total Return (ER + T-bill).
      CRB series dead 2021-02; Bloomberg Commodity Index (BCOM) not available
      in tr_ds_comds.

  # ── Country equity index panel (Datastream) ───────────────────────────────────
  # Source: tr_ds_equities.ds2equityindex + ds2indexdata via wrds_ds_index adapter.
  # ~42 major markets. pi_ = price index (ex-dividend), ri = return index (total).
  # Index selection: active series with longest history per country-code region,
  # verified 2026-06-25 from ds2equityindex + ds2indexdata.
  # Notes on known caveats:
  #   GB: FTATNOF = FTSE Total Non-Financial (sub-index); FTSE All-Share TBD.
  #   FR: FTEFRFY = FTSEUR1ST 300 France (JPY-denominated); EUR version TBD.
