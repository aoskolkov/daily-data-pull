defaults:
  storage_root: ./data
  output_format: parquet
  chunk_rows: 500_000
  # Incremental pulls re-fetch this many days before the watermark, to pick up
  # late reporters and revisions. Override per dataset for lagging panels.
  lookback_days: 14

datasets:
  # ── FX spot rates ───────────────────────────────────────────────────────────
  - name: fx_spot
    source: wrds_sql
    library: comp
    table: exrt_dly
    fields: [datadate, fromcurd, tocurd, exratd]
    incremental_key: datadate
    partition_by: [year]
    note: >
      Compustat daily FX spot rates. fromcurd is typically GBP (anchor), not USD.
      clean/fx_spot.py detects the anchor and converts to local/USD via cross-rate.

  # ── FX forward rates (Datastream via WRDS) ─────────────────────────────────
  # Source: tr_ds_equities.ds2fxcode joined to ds2fxrate (LSEG Datastream).
  # 1578 rate codes; forward tenors: 1W, 1M, 3M, 6M, 9M, 1Y, 2Y, ... 20Y.
  # Data runs 1964-12-30 to present. No currency filter: ~700 of the ~1570 codes
  # are crosses not involving USD (vs EUR, GBP, CHF, ...).
  # Output: long format with columns exratedate, fromcurrcode, tocurrcode,
  #         ratetypecode, exratedesc, midrate, bidrate, offerrate.
  # midrate = units of fromcurrcode per 1 unit of tocurrcode (per 100/1,000/10,000
  #   when exratedesc says "TO 100 ..." etc.).
  - name: fx_forward
    source: wrds_fx
    start: "1964-12-30"
    incremental_key: exratedate
    note: >
      All FX rates (spot + all forward tenors, all currencies) from LSEG Datastream
      via WRDS tr_ds_equities.ds2fxcode + ds2fxrate. 1578 rate codes, 1964–present.
      Tenors: SPOT, ONFD, TNFD, SNFD, 1WFD, 2WFD, 3WFD, 1MFD–11MF, 15MF, 18MF, 21MF, 30MF,
      1YFD–10YF, 12YF, 15YF, 20YF, plus CNH offshore codes (OS*, O10M, O11M, O18M).
      Includes non-USD crosses. Raw midrate = units of fromcurrcode per 1 (or per
      100/1,000/10,000, see exratedesc) unit of tocurrcode.
      clean/fx_forward.py normalises to USD per unit of currency.

  # ── WTI crude spot (Datastream commodities) ─────────────────────────────────
  # NCLCS00 is a Datastream terminal mnemonic NOT available on WRDS (verified 2026-06-25).
  # WRDS has WTI spot via tr_ds_comds: CRUDOIL (Cushing WTI) and EIACRWT (EIA WTI).
  - name: ds_wti_front
    source: datastream
    mnemonic: CRUDOIL
    start: "1986-01-01"
    incremental_key: date_
    note: >
      WTI crude oil spot price at Cushing via Datastream commodities (tr_ds_comds).
      Mnemonic: CRUDOIL = "Crude Oil-West Texas Intermediate Spot Cushing USD/BBL".
      Daily. Units: USD/barrel. Cross-check vs fred_wti_spot.
      Note: NCLCS00 (Datastream continuous contract) is NOT available on WRDS.

  # ── WTI futures term structure (NYMEX nearby contracts) ────────────────────
  # NCLCS00 continuous series is NOT available on WRDS (verified 2026-06-25).
  # Instead, use wrds_fut adapter: builds nearby 1-12 from individual NWS* contracts
  # in tr_ds_fut.wrds_contract_info + tr_ds_fut.wrds_fut_contract.
  # The adapter ranks by lasttrddate per day to assign nearby position.
  - name: ds_wti_curve
    source: wrds_fut
    dsmnem_prefix: NWS       # NYMEX WTI contracts (NWS{MMYY})
    currency: USD
    max_nearby: 12
    price_col: settlement
    start: "1990-01-01"
    incremental_key: date_
    note: >
      NYMEX WTI crude oil futures term structure, nearby 1-12, from individual
      contracts (NWS{MMYY}) in WRDS Datastream tr_ds_fut library.
      STALE: WRDS stopped updating all NWS and NCL contracts after 2026-04-03.
      Output: long format with columns date_, nearby (1-12), price, contrdate, lasttrddate.
      clean/oil_curve.py pivots to wide (tenor columns F1-F12) and computes
      slope/spreads. Units: USD/barrel.

  # ── Brent futures term structure (ICE nearby contracts) ─────────────────────
  # Active ICE Brent individual contracts use prefix LLC (verified 2026-06-25);
  # data runs 2003-09-08 to present. LLC matches ~5 listings per contract month;
  # the wrds_fut adapter keeps one row per (date, last trading day), so nearby
  # 1-12 are 12 distinct contract months.
  # Known dead prefix: LBZCS (ICE-BRENT CRUDE OIL NX), LBZCS00-LBZCS05 discontinued.
  # To list other Brent prefixes: python wrdsdl.py discover tr_ds_fut --table wrds_contract_info
  #   then: SELECT DISTINCT LEFT(dsmnem,3), contrname FROM wrds_contract_info
  #          WHERE UPPER(contrname) LIKE '%BRENT%' AND isocurrcode='USD' LIMIT 20
  - name: ds_brent_curve
    source: wrds_fut
    dsmnem_prefix: LLC       # ICE Brent "CRUDE OIL (BRENT)" contracts, verified 2026-06-25
    currency: USD
    max_nearby: 12
    price_col: settlement
    start: "1990-01-01"
    incremental_key: date_
    note: >
      ICE Brent crude oil futures term structure, nearby 1-12, from individual
      contracts (LLC{MMYY}) in WRDS Datastream tr_ds_fut library.
      Prefix LLC = "CRUDE OIL (BRENT)", USD, 426 contracts through 2039.
      Alternative prefixes available: NBR (LST DAY, 319 contracts to 2034).
      Structure mirrors ds_wti_curve. Units: USD/barrel.

  # ── WTI crude (FRED — sanity check / gap fill) ─────────────────────────────
  - name: fred_wti_spot
    source: external
    provider: fred
    series_id: DCOILWTICO
    start: "1986-01-02"
    note: >
      WTI crude spot price (Cushing, OK) from FRED/EIA. Daily.
      Requires: pip install pandas-datareader
      Use to cross-check ds_wti_front and fill gaps.

  # ── Volatility ───────────────────────────────────────────────────────────────
  # VIX family from FRED (all free, daily)
  - name: vix
    source: external
    provider: fred
    series_id: VIXCLS
    start: "1990-01-02"
    incremental_key: date
    note: "CBOE VIX: 30-day risk-neutral vol of S&P 500. Daily."

  # [BROKEN] VXST discontinued by CBOE 2018-03-27; FRED series no longer accessible
  # via pandas_datareader CSV endpoint. Historical data ends 2018-03-27.
  # To pull manually: wget https://www.cboe.com/us/options/market_statistics/historical_data/
  # and use the file provider.
  # - name: vix9d
  #   source: external
  #   provider: fred
  #   series_id: VXST
  #   start: "2011-01-03"

  - name: vix3m
    source: external
    provider: fred
    series_id: VXVCLS
    start: "2007-12-04"
    incremental_key: date
    note: "CBOE 3-Month VIX (VXV / VXVCLS). Daily."

  # [VERIFY] VXMT and VVIXCLS fail via pandas_datareader CSV endpoint.
  # FRED may require API key for CBOE-licensed series, or IDs have changed.
  # Try: curl "https://fred.stlouisfed.org/graph/fredgraph.csv?id=VXMT" to check.
  # Alternative: download directly from CBOE and use file provider.
  # - name: vix6m
  #   source: external
  #   provider: fred
  #   series_id: VXMT

  # - name: vvix
  #   source: external
  #   provider: fred
  #   series_id: VVIXCLS

  # ── Inflation: CPI level (World Bank) ───────────────────────────────────────
  - name: wb_cpi
    source: external
    provider: worldbank
    indicator: FP.CPI.TOTL
    start: "1960"
    note: >
      World Bank CPI index (2010=100), ~180 countries, annual.
      Requires: pip install pandas-datareader
      clean/inflation.py normalizes and pivots to wide.

  # ── Inflation: CPI % change (World Bank) ────────────────────────────────────
  - name: wb_inflation
    source: external
    provider: worldbank
    indicator: FP.CPI.TOTL.ZG
    start: "1960"
    note: >
      World Bank annual CPI inflation rate (%), ~180 countries.
      Requires: pip install pandas-datareader

  # ── Inflation: CPI monthly (OECD) ───────────────────────────────────────────
  # [BROKEN] OECD migrated from stats.oecd.org to data-explorer.oecd.org in 2024.
  # pandas_datareader's OECD reader hits the old endpoint (now returns 404).
  # Fix: implement a direct SDMX REST adapter for the new OECD API.
  # New endpoint: https://sdmx.oecd.org/public/rest/data/
  # Dataset for CPI: OECD.SDD.STES,DSD_KEI@DF_KEI,4.0/...CPALTT01...M...
  # - name: oecd_cpi
  #   source: external
  #   provider: oecd
  #   dataset: CPI      # old ID, broken

  # ── US Treasury TIC: foreign holdings of US Treasuries ───────────────────────
  # Monthly, by country, from 2000-03. Holdings in billions of USD.
  # Released with ~45-day lag. Source: US Treasury TIC system.
  # Covers the major holders listed each month (19-45 countries, median 35; only 20
  # for 2026 months, which come from the SLT table alone). The "All Other" residual,
  # totals and memo rows are dropped by the adapter.
  - name: tic_foreign_holders
    source: tic
    start: "2000-01-01"
    incremental_key: date
    lookback_days: 365      # SLT table revises the trailing 12 months
    note: >
      US Treasury Major Foreign Holders of Treasury Securities.
      Monthly, ~20-45 countries (median 35), USD billions, 2000-03–present.
      Source: treasury.gov mfhhis01.txt (archive) + ticdata.treasury.gov
      slt_table5.txt (rolling 13 months), updated monthly.

  # ── BIS central bank policy rates ───────────────────────────────────────────
  # Daily, 48 countries (ISO2) + XM (Eurozone), from 1946 (GB, JP, CH, ...) / 1990s (most EM).
  # BIS WS_CBPOL key: FREQ.REF_AREA — just 2 dimensions.
  # Use period_format: daily so startPeriod is sent as YYYY-MM-DD (not YYYY-Q#).
  - name: bis_cbpol
    source: bis
    dataflow: WS_CBPOL
    key: "D."
    start: "1946-01-01"
    period_format: daily
    incremental_key: date
    note: >
      BIS central bank policy rates, daily, 48 countries + Eurozone (XM).
      Source: BIS Statistics API (stats.bis.org) dataflow WS_CBPOL.
      Countries: AR AU BR CA CH CL CN CO CZ DK GB HK HU ID IL IN IS JP KR KW
        MA MK MX MY NO NZ PE PH PL RO RS RU SA SE TH TR US XM ZA, plus pre-euro
        national rates AT BE DE ES FR IT NL PT (to 1998-12), GR (to 2000-12), HR (to 2022-07).
      History: GB JP CH DK SE IN and most pre-euro members from 1946, DE 1948,
        US 1954-07, CA 1960; EM mostly from 1990s–2000s.
      clean/interest_rates.py pivots to wide (date × country ISO2).

  # ── BIS international debt securities outstanding ────────────────────────────
  # Quarterly, 1993-Q1 to present, ~155 issuer countries by nationality / ~158 by
  # residence (plus regional aggregates). Securities issued outside the issuer's
  # local market, by issuer residence (ISSUER_RES) and nationality (ISSUER_NAT).
  # Dimensions (15): FREQ.ISSUER_RES.ISSUER_NAT.ISSUER_BUS_IMM.ISSUER_BUS_ULT.
  #   MARKET.ISSUE_TYPE.ISSUE_CUR_GROUP.ISSUE_CUR.ISSUE_OR_MAT.ISSUE_RE_MAT.
  #   ISSUE_RATE.ISSUE_RISK.ISSUE_COL.MEASURE
  # Key below: Q, all residences/nationalities/sectors, market=C (international
  #   markets), type=A (all), all currency groups, cur=TO1 (total), original and
  #   remaining maturity A (all), rate/risk/collateral A (all), measure=I
  #   (amounts outstanding). Blank = wildcard; "A" is a literal code, not "all".
  #   Until 2026-09-19 the key had ISSUE_OR_MAT=C (short-term) and MEASURE=C
  #   (gross issues), i.e. quarterly issuance of short-term paper only.
  # Codes: python wrdsdl.py discover bis --dataset WS_DEBT_SEC2_PUB
  - name: bis_debt_sec
    source: bis
    dataflow: WS_DEBT_SEC2_PUB
    key: Q.....C.A..TO1.A.A.A.A.A.I
    start: "1993-01-01"
    incremental_key: date
    lookback_days: 365      # quarterly revisions
    note: >
      BIS international debt securities, amounts outstanding, all maturities,
      quarterly. Source: BIS Statistics API (stats.bis.org) dataflow WS_DEBT_SEC2_PUB.
      Amounts in USD millions (unit_measure=USD, unit_mult=6). Rows come in both
      views: ISSUER_NAT=3P ("all countries excluding residents") with a country
      ISSUER_RES gives the by-residence series, and the reverse the by-nationality
      series; each is split by issuer sector (ISSUER_BUS_*: 1 = all) and currency
      group (A = all, D = domestic, F = foreign), so totals are single rows.

  # ── BIS locational banking statistics (LBS) ──────────────────────────────────
  # Quarterly. Cross-border bank claims and liabilities by reporting country.
  # Dimensions (8): FREQ.L_MEASURE.L_POSITION.L_INSTR.L_DENOM.L_CURR_TYPE.L_PARENT_CTY.L_REP_BANK_TYPE
  # Key below: quarterly stocks (S), claims (C), all instruments (A),
  #   all currencies USD-equiv (TO1), all counterpart types (A),
  #   all counterpart countries aggregated (5J), all bank types (A).
  # Gives one series per reporting banking system — ~50 countries.
  - name: bis_lbs
    source: bis
    dataflow: WS_LBS_D_PUB
    key: Q.S.C.A.TO1.A.5J.A
    start: "2000-01-01"
    incremental_key: date
    lookback_days: 365      # quarterly revisions
    note: >
      BIS Locational Banking Statistics, total cross-border claims by reporting country.
      Quarterly, ~50 reporting countries, USD millions.
      Dimensions probed live 2026-06-28: FREQ.L_MEASURE.L_POSITION.L_INSTR.L_DENOM.L_CURR_TYPE.L_PARENT_CTY.L_REP_BANK_TYPE
      Key Q.S.C.A.TO1.A.5J.A = stocks/outstanding, claims (assets), all instruments,
      all-currency total, all counterpart types, all counterpart countries aggregated,
      all bank types. Use discover mode to explore liability-side (C→L) or specific
      counterpart breakdown (5J→specific country code).

  # ── BIS effective exchange rates ─────────────────────────────────────────────
  # Monthly real (CPI-adjusted) EER, broad basket, and nominal EER, narrow basket.
  # Dimensions: FREQ.EER_TYPE.EER_BASKET.REF_AREA
  #   EER_TYPE: R=real, N=nominal
  #   EER_BASKET: B=broad (64 economies in the data, from 1994), N=narrow (26-27 economies, from 1964)
  #   REF_AREA: blank (trailing dot) = all reporting economies; "A" is not a wildcard
  # Index: 2020=100. Source: BIS Statistics API (stats.bis.org) dataflow WS_EER.
  - name: bis_eer_real
    source: bis
    dataflow: WS_EER
    key: "M.R.B."
    start: "1994-01-01"
    period_format: monthly
    incremental_key: date
    lookback_days: 62       # monthly
    note: >
      BIS real effective exchange rates (REER), broad basket (64 economies), monthly.
      CPI-deflated. Index 2020=100. All countries with available data.
      Source: BIS Statistics API (stats.bis.org) dataflow WS_EER.
      Key: FREQ.EER_TYPE.EER_BASKET.REF_AREA — trailing dot = wildcard (all countries).

  - name: bis_eer_nominal
    source: bis
    dataflow: WS_EER
    key: "M.N.N."
    start: "1964-01-01"
    period_format: monthly
    incremental_key: date
    lookback_days: 62       # monthly
    note: >
      BIS nominal effective exchange rates (NEER), narrow basket (27 economies), monthly.
      Index 2020=100. Narrow basket has longer history from 1964 vs broad (1994).
      Source: BIS Statistics API (stats.bis.org) dataflow WS_EER.

  # ── MSCI Standard country equity indices ─────────────────────────────────────
  # Monthly, USD gross total return + price index levels.
  # 45 countries (Russia excluded — MSCI suspended Feb 2022; endpoint returns HTTP 500).
  # Data via MSCI's public webapp endpoint (no API key required).
  - name: msci_indices
    source: msci_web
    start: "1990-01-01"
    frequency: M
    incremental_key: date
    lookback_days: 62       # monthly

  # ── IMF World Economic Outlook ────────────────────────────────────────────────
  # Biannual (April + October). ~190 countries from ~1980 + 5-year projections.
  # Best free source for fiscal aggregates (revenue, expenditure, primary balance,
  # gross/net debt % GDP) and macro projections.
  # Update year/edition after each IMF release (April=1, October=2).
  - name: imf_weo
    source: imf_weo
    year: 2024
    edition: 2        # 1=April, 2=October
    start: "1980"
    incremental_key: date
    lookback_days: 0        # vintage-based; change year/edition and `refresh` instead
    subjects:
      # GDP
      - NGDPD        # GDP current USD (billions)
      - NGDP_RPCH    # Real GDP growth (%)
      # Inflation
      - PCPIPCH      # CPI inflation (%)
      # Fiscal  (codes as of Oct 2024 WEO; older editions used GGREV/GGEXP/GGPB)
      - GGR_NGDP     # General govt revenue (% GDP)
      - GGX_NGDP     # General govt total expenditure (% GDP)
      - GGXCNL_NGDP  # General govt net lending/borrowing = fiscal balance (% GDP)
      - GGXONLB_NGDP # General govt primary net lending/borrowing (% GDP)
      - GGXWDG_NGDP  # General govt gross debt (% GDP)
      - GGXWDN_NGDP  # General govt net debt (% GDP)
      # Same four in levels: national currency, billions (not comparable across countries)
      - GGXCNL
      - GGXONLB
      - GGXWDG
      - GGXWDN
      # External
      - BCA_NGDPD    # Current account balance (% GDP)
      - LUR          # Unemployment rate (%)
    note: >
      IMF World Economic Outlook database, Oct 2024 edition.
      Covers ~190 countries, 1980–2029 (incl. IMF projections beyond 2024).
      Downloaded from imf.org as tab-delimited bulk file (not SDMX API).
      Update year/edition after each IMF release (April and October).
      File cached locally at downloads/imf_weo/ after first pull.

  # ── GDP ──────────────────────────────────────────────────────────────────────
  - name: wb_gdp_usd
    source: external
    provider: worldbank
    indicator: NY.GDP.MKTP.CD
    start: "1960"
    note: "World Bank GDP, current USD, ~195 economies/year (214 in total), annual."

  - name: wb_gdp_growth
    source: external
    provider: worldbank
    indicator: NY.GDP.MKTP.KD.ZG
    start: "1960"
    note: "World Bank GDP growth rate (%), constant prices, ~195 economies/year (214 in total), annual."

  - name: wb_gdp_pcap_usd
    source: external
    provider: worldbank
    indicator: NY.GDP.PCAP.CD
    start: "1960"
    note: "World Bank GDP per capita, current USD, ~195 economies/year (214 in total), annual."

  # ── Consumption ───────────────────────────────────────────────────────────────
  - name: wb_consumption_hh
    source: external
    provider: worldbank
    indicator: NE.CON.PRVT.CD
    start: "1960"
    note: "World Bank household final consumption expenditure, current USD, annual."

  - name: wb_consumption_govt
    source: external
    provider: worldbank
    indicator: NE.CON.GOVT.CD
    start: "1960"
    note: "World Bank general government final consumption expenditure, current USD, annual."

  # ── Investment ────────────────────────────────────────────────────────────────
  - name: wb_investment
    source: external
    provider: worldbank
    indicator: NE.GDI.FTOT.CD
    start: "1960"
    note: "World Bank gross fixed capital formation, current USD, annual."

  # ── Trade ─────────────────────────────────────────────────────────────────────
  - name: wb_exports
    source: external
    provider: worldbank
    indicator: NE.EXP.GNFS.CD
    start: "1960"
    note: "World Bank exports of goods and services, current USD, annual."

  - name: wb_imports
    source: external
    provider: worldbank
    indicator: NE.IMP.GNFS.CD
    start: "1960"
    note: "World Bank imports of goods and services, current USD, annual."

  # ── Capital flows ─────────────────────────────────────────────────────────────
  - name: wb_current_account
    source: external
    provider: worldbank
    indicator: BN.CAB.XOKA.CD
    start: "1960"
    note: "World Bank current account balance, current USD, annual."

  - name: wb_fdi_inflows
    source: external
    provider: worldbank
    indicator: BX.KLT.DINV.CD.WD
    start: "1960"
    note: "World Bank FDI net inflows, current USD, annual."

  - name: wb_fdi_outflows
    source: external
    provider: worldbank
    indicator: BM.KLT.DINV.CD.WD
    start: "1960"
    note: "World Bank FDI net outflows, current USD, annual."

  - name: wb_portfolio_equity
    source: external
    provider: worldbank
    indicator: BX.PEF.TOTL.CD.WD   # was BN.KLT.PTXL.CD (net portfolio investment, all instruments) until 2026-09-19
    start: "1960"
    note: "World Bank portfolio equity net inflows, current USD, annual."

  # ── Government fiscal aggregates (World Bank) ─────────────────────────────────
  # Note: wb_consumption_govt (NE.CON.GOVT.CD) is the G in C+I+G+NX and covers
  # only ~15-20% of total fiscal expenditure. These GC.* indicators are the
  # actual fiscal aggregates from government finance statistics.
  - name: wb_govt_revenue
    source: external
    provider: worldbank
    indicator: GC.REV.TOTL.CD
    start: "1990"
    note: "World Bank central government revenue, current USD, annual."

  - name: wb_govt_revenue_pct
    source: external
    provider: worldbank
    indicator: GC.REV.TOTL.GD.ZS
    start: "1990"
    note: "World Bank central government revenue (% GDP), annual."

  - name: wb_govt_expenditure
    source: external
    provider: worldbank
    indicator: GC.XPN.TOTL.CD
    start: "1990"
    note: "World Bank central government expenditure, current USD, annual."

  - name: wb_govt_expenditure_pct
    source: external
    provider: worldbank
    indicator: GC.XPN.TOTL.GD.ZS
    start: "1990"
    note: "World Bank central government expenditure (% GDP), annual."

  - name: wb_fiscal_balance_pct
    source: external
    provider: worldbank
    indicator: GC.BAL.CASH.GD.ZS
    start: "1990"
    note: "World Bank cash surplus/deficit (% GDP), central government, annual."

  - name: wb_govt_debt_pct
    source: external
    provider: worldbank
    indicator: GC.DOD.TOTL.GD.ZS
    start: "1990"
    note: "World Bank central government debt (% GDP), annual."

  # ── World Bank International Debt Statistics (sovereign debt & arrears) ─────
  # Series used by Arellano, Mateos-Planas & Ríos-Rull, "Partial Default"
  # (JPE 2023), plus creditor / relief breakdowns. IDS needs the multidimensional
  # API (src/adapters/wb_api.py); pandas_datareader cannot see these series.
  # clean/partial_default.py combines the three datasets below.
  - name: wb_ids
    source: wb_api
    wb_source: 6               # International Debt Statistics
    countries: all
    counterpart_area: WLD      # all creditors
    start: 1970
    series:
      # -- used in the paper
      - DT.DOD.DPPG.CD         # External debt stocks, PPG (DOD)
      - DT.TDS.DPPG.CD         # Debt service, PPG (TDS) — IDS carries projections ~8 years ahead
      - DT.IXA.OFFT.CD         # Interest arrears, official creditors
      - DT.IXA.PRVT.CD         # Interest arrears, private creditors
      - DT.AXA.OFFT.CD         # Principal arrears, official creditors
      - DT.AXA.PRVT.CD         # Principal arrears, private creditors
      - DT.IXA.DLXF.CD         # Interest arrears, long-term (= official + private)
      - DT.AXA.DLXF.CD         # Principal arrears, long-term
      # -- context: totals, composition, flows
      - DT.DOD.DECT.CD         # External debt stocks, total
      - DT.TDS.DECT.CD         # Debt service, total
      - DT.DOD.DLXF.CD         # External debt stocks, long-term
      - DT.DOD.OFFT.CD         # PPG, official creditors (DOD)
      - DT.DOD.PRVT.CD         # PPG, private creditors (DOD)
      - DT.DOD.PBND.CD         # PPG, bonds (DOD)
      - DT.DOD.PCBK.CD         # PPG, commercial banks (DOD)
      - DT.INT.DPPG.CD         # Interest payments, PPG
      - DT.AMT.DPPG.CD         # Principal repayments, PPG
      - NY.GNP.MKTP.CD         # GNI
      # -- debt relief and rescheduling
      - DT.DFR.DPPG.CD         # Debt forgiveness or reduction
      - DT.AXF.DPPG.CD         # Principal forgiven
      - DT.IXF.DPPG.CD         # Interest forgiven
      - DT.DSF.DPPG.CD         # Debt stock reduction
      - DT.DSB.DPPG.CD         # Debt buyback
      - DT.DXR.DPPG.CD         # Debt stock rescheduled
      - DT.TXR.DPPG.CD         # Total amount of debt rescheduled
      - DT.AXR.DPPG.CD         # Principal rescheduled
      - DT.IXR.DPPG.CD         # Interest rescheduled (capitalized)
    note: >
      World Bank IDS, annual, ~120 low/middle-income countries + aggregates,
      1970–latest (Dec 2025 release: actuals through 2024). Arrears are stocks
      ("due but not paid, cumulative"). Countries that became high income
      (CHL, HUN, KOR, MYS, PAN, POL, RUS, TTO, URY, VEN, BGR…) are absent from
      the whole history; see wb_ids_archive.

  - name: wb_ids_archive
    source: wb_api
    wb_source: 57              # WDI Database Archives (past vintages)
    start: 1970
    versions:                  # latest vintage that still carries each country
      "201906": [BGR, MYS, PAN, RUS, VEN]   # through 2017 (PAN, MYS: arrears only, through 2016)
      "201412": [BGR, HUN, MYS, PAN, VEN]   # through 2013
      "201012": [BGR, CHL, MYS, PAN, RUS, URY, VEN]  # through 2009
      "200704": [POL, TTO]                  # debt only, through 2005
      "200304": [KOR, POL, TTO]             # debt only, through 2001
    series:
      - DT.DOD.DPPG.CD
      - DT.TDS.DPPG.CD
      - DT.IXA.DPPG.CD         # Interest arrears, PPG — current IDS no longer publishes it
      - DT.AXA.DPPG.CD         # Principal arrears, PPG
    note: >
      Graduated countries' PPG debt, debt service and arrears from archived
      WDI/GDF vintages, verified 2026-09-19. No public vintage has arrears for
      KOR, POL or TTO. Poland's 1981–94 arrears exist only in the restricted
      Debtor Reporting System data the paper obtained by request.

  - name: wb_wdi_macro
    source: wb_api
    wb_source: 2               # World Development Indicators
    countries: all
    start: 1960
    series:
      - NY.GDP.MKTP.CD         # GDP, current US$ (denominator for debt ratios)
      - NY.GDP.MKTP.KD         # GDP, constant 2015 US$ (paper: constant 2010 US$)
      - NE.CON.TOTL.KD         # Final consumption, constant US$ (paper's do-file)
      - NE.CON.PRVT.KD         # Household consumption, constant US$ (paper's appendix)
      - DT.DOD.DPPG.CD         # WDI still carries PPG debt for BGR and RUS
      - DT.TDS.DPPG.CD
    note: "WDI macro series paired with IDS for the partial-default panel."

  # ── IMF external-sector datasets (api.imf.org, SDMX 2.1) ─────────────────────
  # The old dataservices.imf.org API is gone; see src/adapters/imf.py. Keys are
  # given dimension by dimension in the dataflow's order ("" = all). Codes and
  # labels verified 2026-09-19; list what exists with:
  #   python wrdsdl.py discover imf --dataset BOP
  # Countries are ISO3 (plus IMF aggregates such as G001 = World). Values in USD.

  # ── IMF BOP: financial account flows + balances ─────────────────────────────
  - name: imf_bop
    source: imf
    dataflow: BOP
    start: "1980"
    incremental_key: date
    lookback_days: 1095      # BOP revises several years back
    dims:
      COUNTRY: ""
      BOP_ACCOUNTING_ENTRY: [NNAFANIL_T, A_NFA_T, L_NIL_T, A_T, NETCD_T]
      INDICATOR: [D_F, P_F, P_F5, P_F3, O_F, R_F, CAB, KAB, FAB, EO]
      UNIT: USD
      FREQUENCY: A
    label_dims: [BOP_ACCOUNTING_ENTRY, INDICATOR]
    labels:
      NNAFANIL_T.D_F: fdi_net            # net acquisition of assets less net incurrence of liabilities
      A_NFA_T.D_F: fdi_assets
      L_NIL_T.D_F: fdi_liab
      NNAFANIL_T.P_F: port_net
      A_NFA_T.P_F: port_assets
      L_NIL_T.P_F: port_liab
      A_NFA_T.P_F5: port_eq_assets       # equity + investment fund shares
      L_NIL_T.P_F5: port_eq_liab
      A_NFA_T.P_F3: port_dbt_assets      # debt securities
      L_NIL_T.P_F3: port_dbt_liab
      NNAFANIL_T.O_F: other_net
      A_NFA_T.O_F: other_assets
      L_NIL_T.O_F: other_liab
      A_T.R_F: reserves_net              # net acquisition of reserve assets
      NETCD_T.CAB: ca_balance
      NETCD_T.KAB: ka_balance
      NNAFANIL_T.FAB: fa_balance
      NETCD_T.EO: errors_omissions
    note: >
      IMF Balance of Payments (BPM6), annual, ~205 economies, 1980–present.
      Financial account by functional category (assets / liabilities / net) plus
      current, capital and financial account balances. Portfolio equity/debt
      nets are not published separately; clean/capital_flows.py derives them.
      Quarterly data exist too (FREQUENCY: Q, ~157 economies).

  # ── IMF IIP: international investment position (stocks) ─────────────────────
  - name: imf_iip
    source: imf
    dataflow: IIP
    start: "1980"
    incremental_key: date
    lookback_days: 1095
    dims:
      COUNTRY: ""
      BOP_ACCOUNTING_ENTRY: [A_P, L_P, NETAL_P]
      INDICATOR: [D, P_MV, P_F5_MV, P_F3_MV, O, R, IIP, NIIP]
      UNIT: USD
      FREQUENCY: A
    label_dims: [BOP_ACCOUNTING_ENTRY, INDICATOR]
    labels:
      A_P.D: fdi_assets_pos
      L_P.D: fdi_liab_pos
      A_P.P_MV: port_assets_pos
      L_P.P_MV: port_liab_pos
      A_P.P_F5_MV: port_eq_assets_pos
      L_P.P_F5_MV: port_eq_liab_pos
      A_P.P_F3_MV: port_dbt_assets_pos
      L_P.P_F3_MV: port_dbt_liab_pos
      A_P.O: other_assets_pos
      L_P.O: other_liab_pos
      A_P.R: reserves_pos
      A_P.IIP: total_assets_pos
      L_P.IIP: total_liab_pos
      NETAL_P.NIIP: niip_pos
    note: >
      IMF International Investment Position, annual, ~181 economies, 1980–present.

  # ── IMF PIP (formerly CPIS): bilateral portfolio investment positions ───────
  - name: imf_cpis
    source: imf
    dataflow: PIP
    start: "2001"
    incremental_key: date
    lookback_days: 730
    chunk_by: INDICATOR      # all-in-one request is ~140 MB / 2 min; split it
    dims:
      COUNTRY: ""                  # reporter (holder)
      ACCOUNTING_ENTRY: A          # assets as reported by the holder
      INDICATOR: [P_TOTINV_P_USD, P_F51_P_USD, P_F3_P_USD, P_F3_L_P_USD, P_F3_S_P_USD]
      SECTOR: S1                   # all holding sectors
      COUNTERPART_SECTOR: S1       # all issuing sectors
      COUNTERPART_COUNTRY: ""      # issuer economy (G001 = World)
      FREQUENCY: A
    labels:
      P_TOTINV_P_USD: portfolio_total
      P_F51_P_USD: portfolio_equity    # incl. fund shares: equity + debt = total
      P_F3_P_USD: portfolio_debt
      P_F3_L_P_USD: portfolio_ltdebt
      P_F3_S_P_USD: portfolio_stdebt
    note: >
      IMF Portfolio Investment Positions by Counterpart Economy (the CPIS, renamed).
      Reporter × issuer economy, annual, 2001–present, ~94 reporters × ~246
      counterparts. Holder- and issuer-sector breakdowns and currency of
      denomination (…_DIC_<CCY>_…) are also available; change SECTOR /
      COUNTERPART_SECTOR / INDICATOR to get them. Non-country reporters:
      TX093 = SEFER + SSIO (securities held as reserves and by international
      organizations; TX091 = international organizations is in the codelist but
      has no rows in this pull); counterpart GX031 =
      World minus 25 significant financial centers.

  # ── IMF DIP (formerly CDIS): bilateral FDI positions ────────────────────────
  - name: imf_cdis
    source: imf
    dataflow: DIP
    start: "2009"
    incremental_key: date
    lookback_days: 730
    chunk_by: INDICATOR      # all-in-one request is ~175 MB / 11 min; split it
    dims:
      COUNTRY: ""                  # reporting economy
      DV_TYPE: O                   # reported data (SCC = derived from counterparts)
      INDICATOR: [INWD_D_NETLA_FALL_ALL, OTWD_D_NETAL_FALL_ALL, INWD_D_NETLA_F51_ALL,
                  OTWD_D_NETAL_F51_ALL, INWD_D_NETLA_FL_ALL, OTWD_D_NETAL_FL_ALL]
      COUNTERPART_COUNTRY: ""
      FREQUENCY: A
    labels:
      INWD_D_NETLA_FALL_ALL: fdi_inward_total     # directional principle, net
      OTWD_D_NETAL_FALL_ALL: fdi_outward_total
      INWD_D_NETLA_F51_ALL: fdi_inward_equity
      OTWD_D_NETAL_F51_ALL: fdi_outward_equity
      INWD_D_NETLA_FL_ALL: fdi_inward_debt
      OTWD_D_NETAL_FL_ALL: fdi_outward_debt
    note: >
      IMF Direct Investment Positions by Counterpart Economy (the CDIS, renamed).
      Reporter × counterpart economy, annual, 2009–present, ~143 reporters.
      Counterpart TX983 = not specified (incl. confidential).

  # ── Government bond yields 10Y (Datastream economic series) ─────────────────
  # Source: tr_ds_econ.wrds_ecoinfo + ecodata (IMF IFS + Datastream national sources).
  # Frequency: monthly (MONT). Units: percent per annum.
  # Most series are end-of-period (EP) 10-year benchmark yields.
  # Notes on non-standard maturities:
  #   BDGBOND.  Germany  9-10 years (ends 2019-09 — post-euro, Bund issuance slowed)
  #   UKMEDYLD  UK gilt  average redemption yield on 10-yr stock (ends 2019-09)
  #   BGGBOND.  Belgium  6-year-and-over
  #   LVGBOND.  Latvia   5-year treasury bond (not in the list below)
  #   KOGBOND.  Korea    3-year Treasury bond (most liquid KRW benchmark)
  #   MXGBOND.  Mexico   UDIBONO (inflation-linked) 10Y
  - name: ds_bond_yields_10y
    source: wrds_ds_econ
    start: "1950-01-01"
    incremental_key: date_
    lookback_days: 365      # monthly, ragged edge
    mnemonics:
      # United States
      - USTRCN10   # Treasury constant maturity 10Y (1953–present)
      # United Kingdom
      - UKMEDYLD   # 10Y gilt average redemption yield (1963–2019)
      # Euro area
      - BDGBOND.   # Germany 9-10Y govt bond (1957–2019)
      - FRGBOND.   # France govt guaranteed bond yield (EP)
      - ITGBOND.   # Italy Rendistato gross yield (EP)
      - ESGBOND.   # Spain 10Y central govt bond yield
      - NLGBOND.   # Netherlands 10Y central govt bond
      - BGGBOND.   # Belgium central govt bond 6Y+ yield
      - PTGBOND.   # Portugal 10Y benchmark bond (EP) (1993–2019-09)
      - GRGBOND.   # Greece 10Y benchmark bond (EP) (1998–2019-09)
      - OEGBOND.   # Austria 10Y govt bond
      - FNGBOND.   # Finland 10Y govt bond (monthly avg)
      - IRGBOND.   # Ireland 10Y benchmark bond (EP) (1986–2019-09)
      # Nordic / non-euro Europe
      - DKGBOND.   # Denmark 10Y central govt bond (EP)
      - SDGBOND.   # Sweden 10Y govt bond
      - NWGBOND.   # Norway 10Y govt benchmark bond (EP) (1985–2021-06)
      - SWGBOND.   # Switzerland confederation bond 10Y
      - ICGBOND.   # Iceland 10Y treasury bond (EP)
      # Other Europe
      - HNGBOND.   # Hungary 10Y benchmark bond (EP)
      - CZGBOND.   # Czech Republic 10Y long-term bond (EP)
      - POGBOND.   # Poland 10Y govt bond (EP)
      - RMGBOND.   # Romania 10Y govt bond (EP)
      - RSGBOND.   # Russia 10Y govt bond (EP) (2003–2024-06)
      # Asia-Pacific
      - JPGBOND.   # Japan 10Y interest-bearing govt bond (EP)
      - AUGBOND.   # Australia 10Y Commonwealth govt bond
      - NZGBOND.   # New Zealand 10Y govt bond 2nd market
      - KOGBOND.   # Korea 3Y treasury bond (most liquid KRW benchmark)
      - CHGBOND.   # China 10Y govt bond (EP)
      - INGBOND.   # India 10Y treasury bond
      - TWGBD10Y   # Taiwan 10Y govt bond (EP)
      - HKGBOND.   # Hong Kong 10Y govt bond (2010–2024-12)
      - MYGBOND.   # Malaysia 10Y govt bond
      - SPGBOND.   # Singapore 10Y govt bond (EP)
      - THGBOND.   # Thailand 10Y govt bond
      - PHGBOND.   # Philippines 10Y govt bond (EP)
      - PKGBOND.   # Pakistan 10Y govt bond
      # Americas (ex-US)
      - CNGBOND.   # Canada 10Y+ govt bond (EP)
      - BRGBOND.   # Brazil 10Y govt bond (EP)
      - MXGBOND.   # Mexico UDIBONO 10Y (inflation-linked)
      # EMEA
      - TKGBOND.   # Turkey 10Y govt bond (EP)
      - EYGBOND.   # Egypt 10Y govt bond (EP)
    note: >
      10-year government bond yields from LSEG Datastream via WRDS tr_ds_econ.
      Monthly, end-of-period unless noted. Units: percent per annum.
      Not all series run to present: BDGBOND./UKMEDYLD/GRGBOND./IRGBOND./PTGBOND.
      end 2019-09, NWGBOND. 2021-06, RSGBOND. 2024-06, HKGBOND. 2024-12 (Datastream
      discontinued; use alternative sources for current yields if needed).
      clean/interest_rates.py maps mnemonics to ISO2 country codes and pivots wide.

  # ── Monthly CPI (IMF IFS via Datastream economic series) ─────────────────────
  # Source: tr_ds_econ.wrds_ecoinfo + ecodata. Mnemonic pattern: {CC}I64...F
  # = IMF International Financial Statistics line 64, "Consumer Prices, All Items".
  # 164 country series; 159 with data in 2024+. Median history from ~1970.
  # Index level (not % change) — compute YoY in clean script.
  # Units: index; base year varies widely by country (e.g. US 2010, UK 2015,
  #   JP/DE/KR 2020, IN ~2024; only ~21 of 164 series are 2010=100 or 2015=100).
  - name: ds_cpi_monthly
    source: wrds_ds_econ
