      - OMXAFGX    # Sweden: OMX Affarsvarlden General (1980–present, SEK)
      - FTENOKE    # Norway: FTSEUR1ST 300 Norway EUR (1985–present, EUR)
      - FTEDKKE    # Denmark: FTSEUR1ST 300 Denmark EUR (1985–present, EUR)
